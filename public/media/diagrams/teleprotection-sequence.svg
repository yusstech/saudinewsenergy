<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">How teleprotection isolates a fault on a long transmission line</title>
  <desc id="d">Four stages: a fault occurs on the line; relays at both substations measure it; a teleprotection signal passes between them over the fibre in the optical ground wire; circuit breakers at both ends open together to isolate the faulted section.</desc>

  <style>
    .bg    { fill: #faf8f4; }
    .sub   { fill: #ffffff; stroke: #4b5563; stroke-width: 1.8; }
    .line  { stroke: #374151; stroke-width: 3; fill: none; }
    .fibre { stroke: #a86435; stroke-width: 2.6; fill: none; }
    .fibre-d { stroke: #a86435; stroke-width: 2.6; fill: none; stroke-dasharray: 7 5; }
    .fault { stroke: #c8322b; stroke-width: 3; fill: none; stroke-linecap: round; }
    .open  { stroke: #c8322b; stroke-width: 3; fill: none; }
    .stage { font: 700 13px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #a86435; letter-spacing: .1em; }
    .lbl   { font: 500 14px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #374151; }
    .lbl-sm{ font: 400 12.5px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
    .name  { font: 600 12px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #4b5563; }
    .rule  { stroke: #e7e0d3; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #10131a; }
      .sub   { fill: #191d26; stroke: #9aa3b2; }
      .line  { stroke: #cbd2dc; }
      .fibre, .fibre-d { stroke: #e0a878; }
      .fault, .open { stroke: #ef6a62; }
      .stage { fill: #e0a878; }
      .lbl   { fill: #e7e0d3; }
      .lbl-sm{ fill: #9aa3b2; }
      .name  { fill: #9aa3b2; }
      .rule  { stroke: #252b36; }
    }
  </style>

  <rect class="bg" width="960" height="520"/>

  <!-- reusable substation -->
  <defs>
    <g id="station">
      <rect class="sub" x="-38" y="-26" width="76" height="52" rx="3"/>
      <path class="line" d="M-20 -8 h40 M-20 0 h40 M-20 8 h40" stroke-width="1.6"/>
    </g>
    <g id="breaker-closed">
      <rect x="-9" y="-9" width="18" height="18" rx="2" fill="none" stroke="#4b5563" stroke-width="2"/>
      <path d="M-9 0 h18" stroke="#4b5563" stroke-width="2"/>
    </g>
    <g id="breaker-open">
      <rect x="-9" y="-9" width="18" height="18" rx="2" fill="none" stroke="#c8322b" stroke-width="2"/>
      <path d="M-9 0 h5 M4 0 h5 M-4 0 l8 -7" stroke="#c8322b" stroke-width="2"/>
    </g>
  </defs>

  <!-- ============ stage 1 ============ -->
  <g transform="translate(0 20)">
    <text class="stage" x="60" y="0">1 — FAULT</text>
    <g transform="translate(160 34)"><use href="#station"/><text class="name" x="-38" y="42">Substation A</text></g>
    <g transform="translate(740 34)"><use href="#station"/><text class="name" x="-38" y="42">Substation B</text></g>
    <path class="line" d="M198 34 H702"/>
    <path class="fibre" d="M198 16 H702"/>
    <!-- fault symbol -->
    <path class="fault" d="M470 34 l-14 -20 m14 20 l16 -18 m-16 18 l-2 -26 m2 26 l-18 6 m18 -6 l16 10"/>
    <text class="lbl-sm" x="760" y="20">Fibre in the OPGW</text>
    <text class="lbl-sm" x="760" y="40">Phase conductors</text>
  </g>

  <path class="rule" d="M60 140 H900"/>

  <!-- ============ stage 2 ============ -->
  <g transform="translate(0 170)">
    <text class="stage" x="60" y="0">2 — BOTH ENDS MEASURE</text>
    <g transform="translate(160 34)"><use href="#station"/></g>
    <g transform="translate(740 34)"><use href="#station"/></g>
    <path class="line" d="M198 34 H702"/>
    <path class="fibre" d="M198 16 H702"/>
    <path class="fault" d="M470 34 l-12 -16 m12 16 l14 -14 m-14 14 l-2 -20"/>
    <!-- relay measurement arrows toward the fault -->
    <path class="lbl" d="M206 48 h60" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>
    <path class="lbl" d="M694 48 h-60" stroke="#4b5563" stroke-width="1.6" fill="none" marker-end="url(#a1)"/>
    <text class="lbl-sm" x="160" y="86" text-anchor="middle">Relay A sees a fault</text>
    <text class="lbl-sm" x="740" y="86" text-anchor="middle">Relay B sees a fault</text>
    <text class="lbl-sm" x="470" y="94" text-anchor="middle">Neither end alone can tell whether it is inside the protected section.</text>
  </g>

  <path class="rule" d="M60 300 H900"/>

  <!-- ============ stage 3 ============ -->
  <g transform="translate(0 330)">
    <text class="stage" x="60" y="0">3 — THEY AGREE, OVER THE FIBRE</text>
    <g transform="translate(160 34)"><use href="#station"/></g>
    <g transform="translate(740 34)"><use href="#station"/></g>
    <path class="line" d="M198 34 H702"/>
    <path class="fibre-d" d="M198 16 H702"/>
    <path class="fault" d="M470 34 l-12 -16 m12 16 l14 -14"/>
    <circle cx="330" cy="16" r="5" fill="#a86435"/>
    <circle cx="470" cy="16" r="5" fill="#a86435"/>
    <circle cx="610" cy="16" r="5" fill="#a86435"/>
    <text class="lbl-sm" x="470" y="86" text-anchor="middle">Teleprotection signal — a dedicated path, not a public network</text>
  </g>

  <path class="rule" d="M60 452 H900"/>

  <!-- ============ stage 4 ============ -->
  <g transform="translate(0 470)">
    <text class="stage" x="60" y="0">4 — BOTH BREAKERS OPEN</text>
    <g transform="translate(160 22) scale(0.8)"><use href="#station"/></g>
    <g transform="translate(740 22) scale(0.8)"><use href="#station"/></g>
    <path class="line" d="M192 22 H250 M690 22 H748" />
    <g transform="translate(270 22)"><use href="#breaker-open"/></g>
    <g transform="translate(670 22)"><use href="#breaker-open"/></g>
    <path class="open" d="M290 22 H650" stroke-dasharray="6 6" opacity=".45"/>
    <text class="lbl-sm" x="470" y="44" text-anchor="middle">Faulted section isolated at both ends, in a coordinated operation</text>
  </g>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
