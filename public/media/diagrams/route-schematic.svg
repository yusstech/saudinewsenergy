<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">The Al Jouf 380 kV corridor: electrical and optical continuity</title>
  <desc id="d">A schematic of the Al Jouf transmission corridor between two substations, showing 279 towers over an approximately 107 kilometre route, 110.21 kilometres of optical ground wire, 28 fibre joint boxes and two fibre termination panels.</desc>

  <style>
    .bg    { fill: #faf8f4; }
    .sub   { fill: #ffffff; stroke: #4b5563; stroke-width: 1.8; }
    .tower { stroke: #6b7280; stroke-width: 1.4; fill: none; }
    .cond  { stroke: #374151; stroke-width: 2.6; fill: none; }
    .opgw  { stroke: #a86435; stroke-width: 2.6; fill: none; }
    .joint { fill: #a86435; }
    .panel { fill: #1f7a4c; }
    .lbl   { font: 500 14px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #374151; }
    .lbl-sm{ font: 400 12.5px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
    .name  { font: 600 12px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #4b5563; }
    .fig   { font: 700 22px/1 ui-sans-serif, system-ui, sans-serif; fill: #374151; }
    .fig-o { font: 700 22px/1 ui-sans-serif, system-ui, sans-serif; fill: #a86435; }
    .cap   { font: 400 11.5px/1.3 ui-sans-serif, system-ui, sans-serif; fill: #6b7280; letter-spacing: .04em; }
    .rule  { stroke: #e7e0d3; stroke-width: 1; }
    .brace { stroke: #b3a68c; stroke-width: 1.2; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #10131a; }
      .sub   { fill: #191d26; stroke: #9aa3b2; }
      .tower { stroke: #7b8493; }
      .cond  { stroke: #cbd2dc; }
      .opgw  { stroke: #e0a878; }
      .joint { fill: #e0a878; }
      .panel { fill: #3aa06a; }
      .lbl   { fill: #e7e0d3; }
      .lbl-sm, .cap { fill: #9aa3b2; }
      .name  { fill: #9aa3b2; }
      .fig   { fill: #e7e0d3; }
      .fig-o { fill: #e0a878; }
      .rule  { stroke: #252b36; }
      .brace { stroke: #4b5563; }
    }
  </style>

  <rect class="bg" width="960" height="420"/>

  <defs>
    <g id="t2">
      <path class="tower" d="M-7 34 L0 0 L7 34 M-5 24 h10 M-3 12 h6"/>
    </g>
    <g id="station2">
      <rect class="sub" x="-30" y="-24" width="60" height="48" rx="3"/>
      <path class="tower" d="M-16 -8 h32 M-16 0 h32 M-16 8 h32" stroke-width="1.4"/>
    </g>
  </defs>

  <!-- corridor -->
  <g transform="translate(0 150)">
    <g transform="translate(78 0)"><use href="#station2"/><text class="name" x="-30" y="42">Grid connection</text></g>
    <g transform="translate(882 0)"><use href="#station2"/><text class="name" x="30" y="42" text-anchor="end">Grid connection</text></g>

    <!-- towers -->
    <g>
      <use href="#t2" x="160" y="-16"/><use href="#t2" x="230" y="-16"/>
      <use href="#t2" x="300" y="-16"/><use href="#t2" x="370" y="-16"/>
      <use href="#t2" x="440" y="-16"/><use href="#t2" x="510" y="-16"/>
      <use href="#t2" x="580" y="-16"/><use href="#t2" x="650" y="-16"/>
      <use href="#t2" x="720" y="-16"/><use href="#t2" x="790" y="-16"/>
    </g>

    <!-- conductors -->
    <path class="cond" d="M108 4 Q160 14 160 4 Q195 20 230 4 Q265 20 300 4 Q335 20 370 4 Q405 20 440 4 Q475 20 510 4 Q545 20 580 4 Q615 20 650 4 Q685 20 720 4 Q755 20 790 4 Q826 14 852 4"/>

    <!-- OPGW above -->
    <path class="opgw" d="M108 -20 Q160 -10 160 -16 Q195 -4 230 -16 Q265 -4 300 -16 Q335 -4 370 -16 Q405 -4 440 -16 Q475 -4 510 -16 Q545 -4 580 -16 Q615 -4 650 -16 Q685 -4 720 -16 Q755 -4 790 -16 Q826 -10 852 -20"/>

    <!-- joint boxes -->
    <g class="joint">
      <circle cx="230" cy="-10" r="4.5"/><circle cx="370" cy="-10" r="4.5"/>
      <circle cx="510" cy="-10" r="4.5"/><circle cx="650" cy="-10" r="4.5"/>
      <circle cx="790" cy="-10" r="4.5"/>
    </g>
    <!-- termination panels -->
    <rect class="panel" x="104" y="-25" width="9" height="9" rx="1.5"/>
    <rect class="panel" x="847" y="-25" width="9" height="9" rx="1.5"/>
  </g>

  <!-- legend callouts -->
  <g transform="translate(0 60)">
    <path class="brace" d="M108 42 v-10 H852 v10"/>
    <text class="lbl-sm" x="480" y="24" text-anchor="middle">Approximately 107 km route · 279 towers</text>
  </g>

  <g transform="translate(0 244)">
    <circle class="joint" cx="120" cy="0" r="4.5"/>
    <text class="lbl-sm" x="134" y="4">OPGW joint box — where two cable sections are spliced into one optical path</text>
    <rect class="panel" x="116" y="20" width="9" height="9" rx="1.5"/>
    <text class="lbl-sm" x="134" y="29">Fibre termination panel — where the fibre meets the protection and telecom equipment</text>
  </g>

  <path class="rule" d="M60 296 H900"/>

  <!-- figures from the BOQ -->
  <g transform="translate(0 336)">
    <g transform="translate(120 0)">
      <text class="fig-o" x="0" y="0">110.21 km</text>
      <text class="cap" x="0" y="18">OPGW SUPPLY, INSTALLATION AND TESTING</text>
    </g>
    <g transform="translate(400 0)">
      <text class="fig-o" x="0" y="0">28</text>
      <text class="cap" x="0" y="18">OPGW JOINT BOXES</text>
    </g>
    <g transform="translate(540 0)">
      <text class="fig-o" x="0" y="0">2</text>
      <text class="cap" x="0" y="18">FIBRE TERMINATION PANELS</text>
    </g>
    <g transform="translate(740 0)">
      <text class="fig" x="0" y="0">279</text>
      <text class="cap" x="0" y="18">TOWERS</text>
    </g>
  </g>

  <text class="lbl-sm" x="120" y="404">Schematic. Tower spacing and joint positions are illustrative; figures from the project bill of quantities.</text>
  <text class="lbl-sm" x="900" y="404" text-anchor="end">Saudi Energy News</text>
</svg>
